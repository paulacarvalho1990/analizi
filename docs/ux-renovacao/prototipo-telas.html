<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Analizi — Protótipo das telas de relatório</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root,[data-theme="light"]{
  --blue:#3B82F6;--violet:#7C5CF0;--orange:#FF8A3D;--pink:#FF3CAC;--navy:#0B1F4B;
  --bg:#F7F8FA;--surface:#FFFFFF;--fg:#111827;--muted:#6B7280;--faint:#9CA3AF;--border:#E7E9EE;--track:#F1F3F7;
  --primary:#D61F83;--good:#15803D;--good-bg:#E8F6EE;--bad:#B4235E;--bad-bg:#FDEAF3;--warn:#B45309;--warn-bg:#FFF3E6;
  --side:#25272d;--side-2:#343740;--side-line:#454953;--soft-blue:#EEF4FF;--soft-pink:#FFF1F8;
  --shadow:0 1px 2px #1118270a,0 8px 24px -16px #11182726;
}
[data-theme="dark"]{
  --bg:#1E2025;--surface:#292C33;--fg:#F9FAFB;--muted:#A3AEC2;--faint:#7D8798;--border:#3D414A;--track:#33363e;
  --primary:#FF3CAC;--good:#4ADE80;--good-bg:#1f3b2b;--bad:#FF8CC6;--bad-bg:#45213a;--warn:#FDBA74;--warn-bg:#3d2a20;
  --soft-blue:#24314d;--soft-pink:#402036;--shadow:none;
}
*{box-sizing:border-box}
html{color-scheme:light}[data-theme="dark"]{color-scheme:dark}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:var(--bg);color:var(--fg);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px;border-radius:6px}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}

/* shell */
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--side);color:#e8eaf0;padding:24px 14px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:24px;letter-spacing:-1.1px;color:#fff;margin:0 12px 24px}
.brand svg{width:28px;height:24px}
.ws{display:flex;align-items:center;gap:10px;background:var(--side-2);border-radius:10px;padding:10px 12px;margin:0 4px 20px}
.ws i{width:8px;height:8px;border-radius:50%;background:var(--orange);flex:none}
.ws b{display:block;font-size:13px}.ws small{display:block;font-size:11px;color:#a9aeb9}
.ws svg{margin-left:auto;opacity:.7}
.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border-radius:9px;color:#d6d9e0;font-weight:600;font-size:13.5px;margin-bottom:2px;background:none;border:0;cursor:pointer;text-align:left}
.nav button:hover{background:#30333b}
.nav button.on{background:linear-gradient(100deg,#6e2750,#9a3a44);color:#fff}
.nav .tag{margin-left:auto;font-size:10.5px;font-weight:800;border-radius:999px;padding:2px 7px;background:linear-gradient(100deg,var(--primary),var(--orange));color:#fff}
.side-bottom{margin-top:auto;border-top:1px solid var(--side-line);padding-top:12px}

.main{min-width:0;padding:28px 40px 64px;max-width:1360px;width:100%}
.ph{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;flex-wrap:wrap}
.ph h1{margin:0;font-size:28px;letter-spacing:-.04em;font-weight:600;display:flex;align-items:center;gap:10px}
.ph h1 .ico{width:24px;height:24px;color:var(--primary)}
.ph p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:6px 12px;white-space:nowrap}
.status i{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px #22c55e33}
.status b{color:var(--fg);font-weight:600}

/* filtros */
.fbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:20px 0 6px}
.seg{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 11px;border-radius:7px;font-weight:600;font-size:12.5px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--fg);color:var(--bg)}
.range{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:7px 12px;font-size:12.5px;font-weight:600}
.range .ico{width:15px;height:15px;color:var(--muted)}
.fbtn{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:7px 12px;font-weight:600;font-size:12.5px;cursor:pointer}
.fbtn .ico{width:15px;height:15px}
.fbtn em{font-style:normal;background:var(--soft-pink);color:var(--primary);border-radius:999px;padding:0 7px;font-size:11px}
.cmpnote{font-size:12px;color:var(--muted);margin-left:auto}
.adv{display:none;grid-template-columns:repeat(7,1fr);gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-top:8px}
.adv.open{display:grid}
.adv label{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:600;color:var(--muted)}
.adv select{border:1px solid var(--border);background:var(--bg);border-radius:8px;padding:6px 8px;font-size:12.5px;color:var(--fg)}

/* layout */
.grid{display:grid;gap:16px;margin-top:16px}
.g2{grid-template-columns:1.6fr 1fr}.g2e{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px 22px;box-shadow:var(--shadow);min-width:0}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.ch h3{margin:0;font-size:15px;font-weight:600;letter-spacing:-.02em}
.ch p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.cap{margin:12px 0 0;font-size:12.5px;color:var(--muted);display:flex;gap:7px;align-items:flex-start;border-top:1px dashed var(--border);padding-top:10px}
.cap .ico{width:15px;height:15px;margin-top:2px;color:var(--primary)}
.cap b{color:var(--fg);font-weight:600}
.link{color:var(--primary);font-weight:700;font-size:12.5px;display:inline-flex;align-items:center;gap:4px;background:none;border:0;cursor:pointer;padding:0;white-space:nowrap}
.link .ico{width:14px;height:14px}
.tabs{display:flex;background:var(--track);border-radius:9px;padding:3px;gap:2px}
.tabs button{border:0;background:none;padding:5px 10px;border-radius:7px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px #0001}

/* KPI */
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:15px 16px 12px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0}
.kpi .kl{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted);font-weight:600}
.kpi .kv{display:flex;align-items:baseline;gap:8px;margin-top:4px;flex-wrap:wrap}
.kpi .kv b{font-size:27px;font-weight:800;letter-spacing:-.045em;line-height:1.15}
.kpi .kv b.txt{font-size:19px;letter-spacing:-.03em}
.kpi .kd{font-size:12px;color:var(--muted);margin-top:auto;padding-top:6px}
.kpi svg.sp{width:100%;height:30px;margin-top:6px}
.kpi.muted .kv b{color:var(--faint)}
.delta{display:inline-flex;align-items:center;gap:2px;font-size:11.5px;font-weight:800;border-radius:999px;padding:1px 7px;color:var(--good);background:var(--good-bg);white-space:nowrap}
.delta.bad{color:var(--bad);background:var(--bad-bg)}
.delta.flat{color:var(--muted);background:var(--track)}

/* ajuda */
.help{position:relative;display:inline-flex}
.help>button{border:0;background:none;padding:0;cursor:help;display:inline-flex;color:var(--faint)}
.help>button .ico{width:13px;height:13px}
.help .pop{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);width:230px;background:#25272d;color:#eef0f4;border-radius:10px;padding:10px 12px;font-size:12px;font-weight:500;line-height:1.45;box-shadow:0 14px 30px -10px #0008;opacity:0;pointer-events:none;transition:opacity .12s;z-index:30;text-align:left}
.help .pop b{display:block;color:#fff;margin-bottom:2px}
.help:hover .pop,.help:focus-within .pop{opacity:1}

/* jornada */
.journey{position:relative;margin-top:16px;border-radius:20px;overflow:hidden;color:#fff;padding:22px 28px 0;
  background:radial-gradient(circle at 95% 115%,#8e2a58 0%,transparent 38%),radial-gradient(circle at 0% -25%,#1d3d86 0%,transparent 42%),linear-gradient(145deg,#26282e 0%,#1e2025 100%)}
.jh{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.jh h2{margin:0;font-size:16px;font-weight:700;letter-spacing:-.02em}
.jh span{font-size:12px;color:#b8bdc8}
.stages{display:grid;grid-template-columns:1fr 1fr 1fr;margin-top:14px}
.stage .lbl{font-size:12.5px;color:#c9cdd6;font-weight:600;display:flex;align-items:center;gap:6px}
.stage .help>button{color:#c9cdd6}
.stage .n{font-size:42px;font-weight:800;letter-spacing:-.05em;line-height:1.05;margin:3px 0 4px}
.stage .n small{font-size:14px;font-weight:600;color:#c9cdd6;margin-left:5px;letter-spacing:0}
.stage .sub{font-size:12.5px;color:#dfe2e8;margin-top:8px;display:flex;gap:14px;flex-wrap:wrap}
.stage .sub b{color:#fff}
.stage:nth-child(2){padding-left:10px}.stage:nth-child(3){text-align:right}
.stage:nth-child(3) .lbl,.stage:nth-child(3) .sub{justify-content:flex-end}
.journey .delta{background:#5ee7aa1f;color:#5ee7aa}
.band{display:block;width:calc(100% + 56px);height:110px;margin:8px -28px 0}
.jf{display:flex;justify-content:space-between;gap:16px;padding:12px 0 16px;font-size:12.5px;color:#ffd1e8;flex-wrap:wrap}
.jf b{color:#fff}

/* charts */
svg.ch-svg{width:100%;height:auto;display:block;margin-top:10px;overflow:visible}
.ch-svg .gl{stroke:var(--border)}
.ch-svg text{fill:var(--muted);font-size:11px;font-family:Inter}
.ch-svg .prev{fill:none;stroke:var(--faint);stroke-width:1.6;stroke-dasharray:4 5}
.ch-svg .hp .dot{opacity:0}
.ch-svg .hp .tt{opacity:0;pointer-events:none}
.ch-svg .hp:hover .dot,.ch-svg .hp:hover .tt,.ch-svg .hp:focus .dot,.ch-svg .hp:focus .tt{opacity:1}
.ch-svg .hp:focus{outline:none}
.ch-svg .tt rect{fill:#25272d}
.ch-svg .tt .t1{fill:#fff;font-weight:700;font-size:11.5px}
.ch-svg .tt .t2{fill:#b8bdc8;font-size:10.5px}
.ch-svg .peak text{fill:#fff;font-weight:700;font-size:11px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap;align-items:center}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--blue),var(--pink))}
.legend i.d{background:none;border-top:2px dashed var(--faint);height:0}
.legend i.sq{width:10px;height:10px;border-radius:3px}

/* barras horizontais */
.hb{display:grid;gap:10px;margin-top:14px}
.hb .r{display:grid;grid-template-columns:1fr auto;gap:5px 10px;align-items:baseline;font-size:13px}
.hb .r .trk{grid-column:1/3;height:8px}
.hb .r .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .r .nm small{display:block;color:var(--muted);font-size:11px}
.trk{height:10px;background:var(--track);border-radius:99px;overflow:hidden;position:relative}
.trk i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pink),var(--orange))}
.trk i.blue{background:linear-gradient(90deg,var(--blue),var(--violet))}
.hb .r b{text-align:right;font-variant-numeric:tabular-nums}

/* tabelas */
.tw{overflow-x:auto;margin-top:12px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{font-size:11.5px;color:var(--muted);font-weight:600;text-align:left;padding:0 10px 8px 0;border-bottom:1px solid var(--border);white-space:nowrap}
.t td{padding:10px 10px 10px 0;border-bottom:1px solid var(--border);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t .r{text-align:right}
.t th.r{text-align:right}
.t .pg b{display:block;font-weight:600}
.t .pg small,.t small.m{color:var(--muted);font-size:11.5px}
.t code{font-family:inherit;font-size:11.5px;background:var(--track);border-radius:6px;padding:1px 6px;color:var(--muted)}
.cell-bar{display:flex;align-items:center;gap:8px;min-width:140px}
.cell-bar b{min-width:42px;text-align:right;font-variant-numeric:tabular-nums}
.cell-bar .trk{flex:1;height:7px}
.chip{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 8px;white-space:nowrap}
.chip.g{background:var(--good-bg);color:var(--good)}.chip.w{background:var(--warn-bg);color:var(--warn)}.chip.b{background:var(--bad-bg);color:var(--bad)}.chip.n{background:var(--track);color:var(--muted)}
.more{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:var(--muted)}

/* donut */
.dn{display:flex;align-items:center;gap:20px;margin-top:14px}
.dn .dw{position:relative;width:120px;height:120px;flex:none}
.dn .dw svg{width:100%;height:100%;transform:rotate(-90deg)}
.dn .dw .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.dn .dw .c b{font-size:24px;font-weight:800;letter-spacing:-.05em;line-height:1}
.dn .dw .c span{font-size:11px;color:var(--muted)}
.lg{list-style:none;padding:0;margin:0;flex:1;min-width:0}
.lg li{display:grid;grid-template-columns:10px 1fr auto;gap:2px 9px;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
.lg li:last-child{border:0}
.lg li i{width:10px;height:10px;border-radius:3px}
.lg li b{font-variant-numeric:tabular-nums}
.lg li small{grid-column:2/4;color:var(--muted);font-size:11.5px;margin-top:-3px}

/* stack bar */
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:2px;margin-top:12px}
.stack i{display:block;height:100%}

/* hub tiles */
.tile{display:flex;flex-direction:column}
.tile .ch h3{display:flex;align-items:center;gap:8px}
.tile .ch h3 .ico{color:var(--primary);width:16px;height:16px}
.tile .foot{margin-top:auto;padding-top:12px}

/* heat grid */
.hg{display:grid;grid-template-columns:30px repeat(24,minmax(0,1fr));gap:3px;margin-top:14px;font-size:10.5px;color:var(--muted)}
.hg span{display:flex;align-items:center}
.hg .c{height:16px;border-radius:4px;background:var(--track);position:relative}
.hg .c:hover{outline:2px solid var(--fg);z-index:2}
.hg .hh{justify-content:center}
.hscale{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);margin-top:10px}
.hscale i{width:120px;height:8px;border-radius:99px;background:linear-gradient(90deg,var(--track),#FFD2B3,#FF8A3D,#FF3CAC)}

/* mapa */
.tmap{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:300px}
.tmap div{aspect-ratio:1;border-radius:7px;display:grid;place-content:center;font-size:10.5px;font-weight:700;background:var(--track);color:var(--muted)}
.mapwrap{display:grid;grid-template-columns:300px 1fr;gap:24px;align-items:center;margin-top:14px}

/* split orgânico/pago */
.split{display:flex;height:44px;border-radius:12px;overflow:hidden;margin-top:14px}
.split div{display:flex;align-items:center;padding:0 14px;color:#fff;font-weight:700;font-size:13px;white-space:nowrap}
.split2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.split2 > div{border-radius:10px;background:var(--track);padding:10px 12px;font-size:12.5px}
.split2 b{display:block;font-size:18px;letter-spacing:-.03em}

/* heatmap page */
.hm{display:grid;grid-template-columns:1fr 300px;gap:16px;margin-top:16px}
.hmc{max-height:860px;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;display:grid;grid-template-columns:62px 1fr;gap:12px}
.scroll-rail{position:relative;border-radius:10px;overflow:hidden}
.scroll-rail i{position:absolute;left:0;right:0}
.scroll-rail span{position:absolute;left:0;right:0;text-align:center;font-size:11px;font-weight:800;color:#fff;transform:translateY(-50%)}
.phonepg{position:relative;background:var(--bg);border:1px solid var(--border);border-radius:14px;overflow:hidden;max-width:420px;margin:0 auto;width:100%}
.blk{position:absolute;left:10px;right:10px;border-radius:8px;border:1px dashed var(--border);display:flex;align-items:flex-start;padding:8px 10px;font-size:11px;color:var(--muted);font-weight:600}
.blk.solid{background:var(--surface);border-style:solid}
.blob{position:absolute;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;mix-blend-mode:normal}
.pin{position:absolute;transform:translate(-50%,-50%);background:#25272d;color:#fff;font-size:10.5px;font-weight:800;border-radius:999px;padding:2px 7px;border:2px solid #fff}
.fold{position:absolute;left:0;right:0;border-top:2px dashed var(--primary);font-size:10.5px;color:var(--primary);font-weight:700;padding:2px 8px;text-align:right}

/* insights */
.isum{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.isum div{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px}
.isum div b{font-size:22px;letter-spacing:-.04em}
.isum div span{font-size:12.5px;color:var(--muted);line-height:1.3}
.ins{display:grid;grid-template-columns:5px 1fr;gap:0;background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-top:14px;box-shadow:var(--shadow)}
.ins>i{display:block}
.ins .body{padding:18px 22px}
.ins .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ins h3{margin:8px 0 12px;font-size:17px;letter-spacing:-.025em}
.ins .cols{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:12px}
.ins .cols>div{background:var(--bg);border-radius:12px;padding:12px 14px;font-size:13px}
.ins .cols h4{margin:0 0 4px;font-size:11.5px;color:var(--muted);font-weight:700}
.ins .ev{display:flex;align-items:flex-end;gap:12px;margin-top:8px}
.ins .ev b{font-size:22px;letter-spacing:-.04em}
.ins .act{display:flex;gap:10px;margin-top:12px;align-items:center}
.btn{border:0;border-radius:10px;padding:8px 14px;font-weight:700;font-size:12.5px;cursor:pointer;background:var(--primary);color:#fff;display:inline-flex;align-items:center;gap:6px}
.btn.ghost{background:none;border:1px solid var(--border);color:var(--fg)}
.btn .ico{width:15px;height:15px}

.sec-t{font-size:13px;font-weight:700;color:var(--muted);margin:28px 0 0;display:flex;align-items:center;gap:10px}
.sec-t::after{content:"";flex:1;border-top:1px solid var(--border)}

.theme-fab{position:fixed;right:18px;bottom:18px;z-index:40;display:flex;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:4px;box-shadow:0 10px 30px -12px #0005}
.theme-fab button{border:0;background:none;padding:6px 12px;border-radius:999px;font-weight:700;font-size:12px;color:var(--muted);cursor:pointer}
.theme-fab button.on{background:var(--side);color:#fff}

@media (max-width:1180px){.g5{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(2,1fr)}.g2,.g2e,.hm{grid-template-columns:1fr}.adv{grid-template-columns:repeat(4,1fr)}}

 return s+'</svg>'}

function speedChip(ms){const s=(ms/1000).toFixed(1).replace('.',',')+'s';return `<span class="chip ${ms<1800?'g':ms<2500?'w':'b'}">${s}</span>`}
function exitChip(e){return `<span class="chip ${e<20?'g':e<35?'n':'b'}">${e}%</span>`}
function pageScatter(){const W=520,Hh=250,X0=40,X1=W-20,YT=14,YB=Hh-34;const x=v=>X0+(v-30)/200*(X1-X0-60),y=v=>YT+(v-8)/62*(YB-YT);
 let s=`<svg viewBox="0 0 ${W} ${Hh}" class="ch-svg" role="img" aria-label="Tempo de atenção versus taxa de saída por página"><rect x="${x(90)}" y="${YT}" width="${X1-x(90)}" height="${y(25)-YT}" fill="#15803D" fill-opacity=".06" rx="8"/><text x="${X1-6}" y="${YT+14}" text-anchor="end" style="fill:var(--good);font-weight:700">prendem a atenção</text><rect x="${X0}" y="${y(25)}" width="${x(90)-X0}" height="${YB-y(25)}" fill="#FF3CAC" fill-opacity=".06" rx="8"/><text x="${X0+6}" y="${YB-8}" style="fill:var(--bad);font-weight:700">precisam de atenção</text><line class="gl" x1="${X0}" x2="${X1}" y1="${YB}" y2="${YB}"/><text x="${(X0+X1)/2}" y="${Hh-6}" text-anchor="middle">mais tempo de atenção →</text><text x="12" y="${(YT+YB)/2}" transform="rotate(-90 12 ${(YT+YB)/2})" text-anchor="middle">↓ mais gente sai</text>`;
 pages.forEach(p=>{const R=5+Math.sqrt(p.views)/3.2;s+=`<circle cx="${x(p.attentionSeconds)}" cy="${y(p.exitRate)}" r="${R}" fill="#3B82F6" fill-opacity=".2" stroke="#3B82F6" stroke-width="2"/><text x="${p.attentionSeconds>180?x(p.attentionSeconds)-R-4:x(p.attentionSeconds)+R+4}" y="${y(p.exitRate)+({'/sobre':-6,'/convenios':10,'/contato':-4}[p.path]||4)}" text-anchor="${p.attentionSeconds>180?'end':'start'}" style="fill:var(--fg);font-weight:600">${p.title.split(':')[0]}</text>`});return s+'</svg>'}
function Pages(){
  const mx=Math.max(...pages.map(p=>p.views));const avgLoad=pages.reduce((a,p)=>a+p.loadTimeMs,0)/pages.length;

    ${kpi({l:'Velocidade média',v:(avgLoad/1000).toFixed(1).replace('.',',')+'s',desc:'tempo para a página abrir',h:'Tempo que a página leva para aparecer na tela. Até 2,5s é considerado bom pelo Google.'})}
    ${kpi({l:'Taxa média de saída',v:exitAvg,desc:'visitas que saíram sem interagir',inv:1,d:-2,h:'De cada 100 visitas, quantas terminaram sem interação. Quanto menor, melhor.'})}
  </div>
  <div class="grid">${card('Desempenho das páginas','Volume, atenção, velocidade e saída de cada página',
   `<div class="tw"><table class="t"><thead><tr><th>Página</th><th>Visualizações</th><th class="r">Tempo de atenção</th><th class="r">Velocidade</th><th class="r">Taxa de saída</th><th class="r">Contatos</th></tr></thead><tbody>${pages.map(p=>`<tr><td class="pg"><b>${p.title}</b><code>${p.path}</code></td><td>${cellBar(p.views,mx)}</td><td class="r num">${dur(p.attentionSeconds)}</td><td class="r">${speedChip(p.loadTimeMs)}</td><td class="r">${exitChip(p.exitRate)}</td><td class="r num"><b>${p.contactsP}</b></td></tr>`).join('')}</tbody></table></div>
   <div class="legend" style="margin-top:10px"><span><i class="sq" style="background:var(--good-bg);border:1px solid var(--good)"></i>bom</span><span><i class="sq" style="background:var(--warn-bg);border:1px solid var(--warn)"></i>atenção</span><span><i class="sq" style="background:var(--bad-bg);border:1px solid var(--bad)"></i>precisa melhorar</span></div>`,
   tabs(['Mais acessadas','Mais rápidas','Maior atenção','Menor saída']))}</div>
  <div class="grid g2e">
    ${card('Atenção × saída','Cada bolha é uma página · tamanho = visualizações',pageScatter(),'',`O post <b>Clareamento: mitos e verdades</b> prende a leitura (3min 32s), mas 64% saem depois dele. Falta um convite para agendar no fim do texto.`)}
    ${card('Velocidade de carregamento','Segundos até a página aparecer · linha = limite recomendado',(()=>{const W=520,Hh=250,X0=150,X1=W-30,YT=10;const rh=(Hh-30)/pages.length;const x=v=>X0+v/3000*(X1-X0);let s=`<svg viewBox="0 0 ${W} ${Hh}" class="ch-svg" role="img" aria-label="Velocidade por página">`;[...pages].sort((a,b)=>b.loadTimeMs-a.loadTimeMs).forEach((p,i)=>{const yy=YT+i*rh;const c=p.loadTimeMs<1800?'#15803D':p.loadTimeMs<2500?'#FF8A3D':'#FF3CAC';s+=`<text x="${X0-10}" y="${yy+rh/2+4}" text-anchor="end" style="fill:var(--fg)">${p.title.length>20?p.title.slice(0,19)+'…':p.title}</text><rect x="${X0}" y="${yy+rh*.2}" width="${x(p.loadTimeMs)-X0}" height="${rh*.6}" rx="5" fill="${c}"/><text x="${x(p.loadTimeMs)+6}" y="${yy+rh/2+4}" style="fill:var(--fg);font-weight:700">${(p.loadTimeMs/1000).toFixed(1).replace('.',',')}s</text>`});s+=`<line x1="${x(2500)}" x2="${x(2500)}" y1="${YT}" y2="${Hh-24}" stroke="var(--fg)" stroke-dasharray="4 4"/><text x="${x(2500)}" y="${Hh-8}" text-anchor="middle">2,5s</text></svg>`;return s})(),'',`Páginas acima de 2,5s perdem visitantes no celular. Comprimir as imagens costuma resolver.`)}

/* ---------------- HEATMAP ---------------- */
function Heatmap(){
  const L=H.layout,scale=360/L.viewportWidth,ph=L.pageHeight*scale;const mxc=Math.max(...H.clicks.map(c=>c.count));
  const sr=H.scrollRetention;const marks=[[25,sr['25'].percentage],[50,sr['50'].percentage],[75,sr['75'].percentage],[100,sr['100'].percentage]];
  let rail=`<div class="scroll-rail" style="height:${ph}px;background:linear-gradient(180deg,#FF3CAC 0%,#FF8A3D ${marks[1][0]}%,#FFD2B3 ${marks[2][0]}%,var(--track) 100%)">`;rail+=`<span style="top:3%">100%</span>`+marks.map(([p,v])=>`<i style="top:${p}%;border-top:2px solid #fff6"></i><span style="top:${Math.min(p,97)}%">${v}%</span>`).join('')+'</div>';
  let pg=`<div class="phonepg" style="height:${ph}px;max-width:360px">`;
  L.blocks.forEach(b=>{pg+=`<div class="blk ${['button','header'].includes(b.type)?'solid':''}" style="top:${b.top*scale}px;height:${b.height*scale-6}px;${b.type==='button'?'left:'+(b.left*scale)+'px;right:auto;width:'+(b.width*scale)+'px;align-items:center;justify-content:center;background:var(--primary);color:#fff;border:0':''}">${b.label}</div>`});
  pg+=`<div class="fold" style="top:${L.viewportHeight*scale}px">fim da 1ª tela</div>`;
  H.clicks.forEach(c=>{const f=c.count/mxc,r=24+f*46;const x=c.x_pct/100*360,y=c.y_px*scale;pg+=`<div class="blob" style="left:${x}px;top:${y}px;width:${r*2}px;height:${r*2}px;background:radial-gradient(circle,rgba(255,60,172,${.35+f*.45}) 0%,rgba(255,138,61,${.25+f*.3}) 40%,rgba(255,138,61,0) 70%)"></div><span class="pin" style="left:${x}px;top:${y}px">${c.count}</span>`});
  pg+='</div>';
  const sorted=[...H.clicks].sort((a,b)=>b.count-a.count);
  return header('i-flame','Heatmap e Rolagem','Onde os visitantes clicam e até onde descem na página.',false)+
  `<div class="fbar"><div class="seg">${['7D','30D','90D'].map(p=>`<button class="${p==='30D'?'on':''}">${p}</button>`).join('')}</div><label class="range">${ico('i-file')}<select style="border:0;background:none;font-weight:600"><option>Página inicial ( / )</option><option>Especialidades</option><option>Agende sua consulta</option></select></label><div class="seg"><button>${'Computador'}</button><button class="on">Celular</button></div><span class="cmpnote">${fmt(H.totalVisitors)} visitantes nesta página</span></div>
  <div class="hm">
    <div class="hmc"><div><div style="font-size:11px;color:var(--muted);font-weight:700;margin-bottom:6px;text-align:center">Rolagem</div>${rail}</div><div><div style="font-size:11px;color:var(--muted);font-weight:700;margin-bottom:6px;text-align:center">Cliques na página</div>${pg}</div></div>
    <div style="display:flex;flex-direction:column;gap:16px">
      ${card('Até onde descem','De cada 100 visitantes',hbars(marks.map(([p,v])=>({n:`${p}% da página`,v,d:v+'%'}))),'',`Só <b>${sr['50'].percentage}%</b> chegam à metade. O formulário de agendamento, no fim da página, é visto por menos de 1 em cada 5 pessoas.`)}
      ${card('Elementos mais clicados',`${fmt(sum(H.clicks,'count'))} cliques no período`,hbars(sorted.map(c=>({n:c.label,s:c.tag==='a'?'link':'botão',v:c.count})),''),'',`<b>Agendar pelo WhatsApp</b> recebe ${Math.round(sorted[0].count/sum(H.clicks,'count')*100)}% dos cliques. O botão está no lugar certo.`)}
    </div>
  </div>`;
}

}

/* ---------------- router ---------------- */
const PAGES={dashboard:Dashboard,acquisition:Acquisition,audience:Audience,pages:Pages,results:Results,heatmap:Heatmap,insights:Insights};
function go(p){if(!PAGES[p])p='dashboard';document.getElementById('nav').innerHTML=NAV.map(([k,l,i])=>`<button class="${k===p?'on':''}" data-go="${k}">${ico(i)}${l}${k==='insights'?'<span class="tag">3 novos</span>':''}</button>`).join('');document.getElementById('main').innerHTML=PAGES[p]();if(location.hash!=='#'+p)history.replaceState(null,'','#'+p);window.scrollTo(0,0)}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}const tb=e.target.closest('.tabs button');if(tb){tb.parentNode.querySelectorAll('button').forEach(b=>{b.classList.toggle('on',b===tb);b.setAttribute('aria-selected',b===tb)});const card=tb.closest('.card');if(card&&card.querySelector('#vw-chart')){const t=[...tb.parentNode.children].indexOf(tb)===1;card.querySelector('#vw-chart').hidden=t;card.querySelector('#vw-table').hidden=!t}}const sb=e.target.closest('.seg button');if(sb){sb.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===sb))}});
function setTheme(t){document.documentElement.dataset.theme=t;document.querySelectorAll('.theme-fab button').forEach(b=>b.classList.toggle('on',b.dataset.t===t))}

document.getElementById('tg').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
window.addEventListener('hashchange',()=>go(location.hash.slice(1)));
go(location.hash.slice(1));
</script>
